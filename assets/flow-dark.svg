<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="How I work with agents: grill until the spec is clear, spec, tickets, one fresh subagent per ticket writing tests first, a gate of tests and evals (fail goes back to the subagent), then human review."><style>.n{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#8b949e;text-anchor:middle}.node{opacity:0;animation:fade .4s ease-out forwards}@keyframes fade{to{opacity:1}}.draw{opacity:0;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out forwards}@keyframes draw{1%{opacity:1}to{opacity:1;stroke-dashoffset:0}}.pulse{opacity:0;animation:fade .2s 3.1s forwards}@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;clip-path:none!important;stroke-dashoffset:0!important}.pulse{display:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><g class="node" style="animation-delay:0.00s"><rect x="12" y="67" width="116" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="70" y="100" class="n">Grill</text><text x="70" y="147" class="s">questions until</text><text x="70" y="163" class="s">the spec is clear</text></g><line class="draw" style="animation-delay:0.20s" x1="128" y1="95" x2="157" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" pathLength="1"/><g class="node" style="animation-delay:0.45s"><rect x="163" y="67" width="84" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="205" y="100" class="n">Spec</text></g><line class="draw" style="animation-delay:0.65s" x1="247" y1="95" x2="277" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" pathLength="1"/><g class="node" style="animation-delay:0.90s"><rect x="283" y="67" width="84" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="325" y="100" class="n">Tickets</text></g><line class="draw" style="animation-delay:1.10s" x1="367" y1="95" x2="406" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" pathLength="1"/><g class="node" style="animation-delay:1.35s"><rect x="412" y="67" width="116" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="470" y="100" class="n">Subagent</text><text x="470" y="147" class="s">one per ticket</text><text x="470" y="163" class="s">test first</text></g><line class="draw" style="animation-delay:1.55s" x1="528" y1="95" x2="592" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" pathLength="1"/><g class="node" style="animation-delay:1.80s"><path d="M640 53 L686 95 L640 137 L594 95 Z" fill="#1f2a1f" stroke="#3fb950" stroke-width="2"/><text x="640" y="100" class="n">Gate</text><text x="640" y="147" class="s">tests · evals</text></g><line class="draw" style="animation-delay:2.00s" x1="682" y1="95" x2="752" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" pathLength="1"/><g class="node" style="animation-delay:2.25s"><rect x="758" y="67" width="84" height="56" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="800" y="100" class="n">Human</text><text x="800" y="147" class="s">review</text></g><path class="draw" style="animation-delay:2.45s" d="M640 53 C 640 18, 470 18, 470 60" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="1" marker-end="url(#b)" pathLength="1"/><text class="node" style="animation-delay:2.45s" x="555" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#f85149">fail → back to the subagent</text><circle class="pulse" r="5" fill="#3fb950"><animateMotion dur="3.2s" begin="3.1s" repeatCount="indefinite" path="M128 95 L752 95"/></circle></svg>
